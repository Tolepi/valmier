<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>~</title>
    <style>
        body {
            background-color: #121212;
            color: #e4e4e4;
            font-family: Terminess Nerd Font;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        form { margin-bottom: 40px; }
        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid #4e4e4e;
            color: #ffffff;
            font-size: 1.5rem;
            padding: 10px;
            width: 400px;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus { border-bottom-color: #ffffff; }
        .links { display: flex; gap: 30px; }
        a {
            color: #888888;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.2s;
        }
        a:hover { color: #ffffff; }
    </style>
</head>
<body>

    <!-- Buscador directo a Google -->
    <form action="https://google.com/" method="get">
        <input type="text" name="q" placeholder="Buscar..." autofocus autocomplete="off">
    </form>

    <!-- Enlaces directos -->
    <div class="links">
        <a href="https://github.com">github</a>
        <a href="https://reddit.com">reddit</a>
        <a href="https://youtube.com">youtube</a>
        <a href="https://wikipedia.org">wikipedia</a>
    </div>

</body>
</html>
